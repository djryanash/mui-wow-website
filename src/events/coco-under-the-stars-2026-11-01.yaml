details:
  en: >-
    An evening on the beach: music, games and Halloween crafts while the
    sun sets, then COCO on the big screen under the stars. Come as you
    are or in costume. Bring your own blanket or picnic setup, or rent a
    seat. Every reservation and bit of support keeps these community
    events going.
  es: >-
    Una tarde en la playa: música, juegos y manualidades de Halloween
    mientras se pone el sol, y luego COCO en la pantalla grande bajo las
    estrellas. Ven como eres o disfrazado. Trae tu manta o tu picnic, o
    alquila un asiento. Cada reserva y cada poco de apoyo mantiene
    vivos estos eventos comunitarios.
  zh: >-
    一個喺沙灘上嘅黃昏：日落時分有音樂、遊戲同萬聖節手作堂，之後喺星空下
    再睇《COCO》大銀幕。扮鬼扮馬、隨心而嚟。可以自己帶毛氈同野餐墊，
    或者租個座位。你嘅每次登記同支持，都令呢啲社區活動繼續辦得成。

